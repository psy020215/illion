<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>문의하기 | Acme AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
<header id="site-header"></header>
<section class="phead"><div class="wrap">
  <div class="crumb"><a href="index.html">홈</a> / 문의하기</div>
  <h1><b>문의하기</b></h1>
  <p>도입 상담, 제휴, 채용 등 무엇이든 편하게 문의해 주세요. 영업일 기준 2일 안에 답변드립니다.</p>
</div></section>

<section class="band"><div class="wrap split">
  <div>
    <h2>연락처</h2>
    <dl class="info">
      <dt>주소</dt><dd>서울특별시 강남구 테헤란로 000, 00층</dd>
      <dt>이메일</dt><dd>contact@acme-ai.example</dd>
      <dt>전화</dt><dd>02-000-0000</dd>
      <dt>운영시간</dt><dd>평일 09:00–18:00</dd>
    </dl>
    <p class="sample">연락처는 시안용 예시입니다.</p>
  </div>
  <div>
    <h2>문의 남기기</h2>
    <form id="contact-form">
      <label>이름<input name="name" required autocomplete="name"></label>
      <label>회사명<input name="company" autocomplete="organization"></label>
      <label>이메일<input name="email" type="email" required autocomplete="email"></label>
      <label>문의 유형<select name="type"><option>도입 상담</option><option>제휴</option><option>채용</option><option>기타</option></select></label>
      <label>내용<textarea name="msg" required></textarea></label>
      <button class="btn pri" type="submit">보내기</button>
      <div class="ok" id="form-ok" role="status">시안 단계라 실제로 전송되지는 않습니다. 실제 오픈 시 메일 발송 기능을 연결합니다.</div>
    </form>
  </div>
</div></section>

<footer id="site-footer"></footer>
<script src="assets/js/main.js"></script>
</body>
</html>
