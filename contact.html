<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>문의하기 | 이리온 코리아</title>
<meta name="description" content="(주)이리온 코리아 — 화장품 원료 공급 기업. 취급 원료, 회사 소개, 공지사항, 문의.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
<header id="site-header"></header>
<section class="phead"><div class="wrap">
  <div class="crumb"><a href="index.html">홈</a> / 문의하기</div>
  <h1><b>문의하기</b></h1>
  <p>원료 문의, 샘플 요청, 제휴 등 무엇이든 편하게 연락 주세요.</p>
</div></section>

<section class="band"><div class="wrap split">
  <div>
    <h2>연락처</h2>
    <dl class="info" id="info"></dl>
    <iframe class="map" id="map" title="이리온 코리아 위치 지도" loading="lazy" style="margin-top:28px" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
  <div>
    <h2>문의 남기기</h2>
    <form id="contact-form">
      <label>이름<input name="name" required autocomplete="name"></label>
      <label>회사명<input name="company" autocomplete="organization"></label>
      <label>연락처<input name="phone" type="tel" autocomplete="tel"></label>
      <label>이메일<input name="email" type="email" required autocomplete="email"></label>
      <label>문의 유형<select name="type"><option>원료 문의</option><option>샘플 요청</option><option>제휴</option><option>기타</option></select></label>
      <label>내용<textarea name="msg" required placeholder="찾으시는 원료나 효능, 수량 등을 적어 주세요."></textarea></label>
      <button class="btn pri" type="submit">메일로 보내기</button>
      <div class="ok" id="form-ok" role="status">메일 프로그램이 열리면 내용을 확인하고 보내기를 눌러 주세요. 열리지 않으면 왼쪽 이메일 주소로 직접 보내 주세요.</div>
    </form>
  </div>
</div></section>

<footer id="site-footer"></footer>
<script src="assets/vendor/js-yaml.min.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
